<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ders Deneyimi Panosu</title>
  <meta name="description" content="Haftalık ders içeriklerini, görevleri ve ilerlemeni takip et.">
  <script>
    // Kayıtlı temayı CSS yüklenmeden uygula; koyu tema seçiliyken sayfa bir an açık görünmesin (#51).
    try {
      const theme = JSON.parse(localStorage.getItem('ldp:v1:prefs'))?.theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch { /* depolama yoksa sistem teması kullanılır */ }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#gorevler">Görevlere geç</a>

  <header class="topbar">
    <div class="topbar__title">
      <h1 id="course-title">Ders Deneyimi Panosu</h1>
      <p id="course-term" class="muted"></p>
    </div>
    <div class="topbar__tools">
      <label class="search" for="search">
        <span class="visually-hidden">Görevlerde ara</span>
        <input id="search" type="search" placeholder="Görev ara" autocomplete="off">
      </label>
      <button id="theme-toggle" class="btn" type="button" aria-pressed="false">Koyu tema</button>
    </div>
  </header>

  <main>
    <div id="notice" class="notice" role="status" hidden></div>
    <p id="announce" class="visually-hidden" role="status" aria-live="polite"></p>

    <section class="overview" aria-labelledby="progress-heading">
      <h2 id="progress-heading" class="visually-hidden">Genel ilerleme</h2>
      <div id="progress-summary"></div>
      <div id="upcoming" class="upcoming" aria-labelledby="upcoming-heading"></div>
    </section>

    <section aria-labelledby="weeks-heading">
      <h2 id="weeks-heading">Haftalar</h2>
      <div id="weeks" class="weeks"></div>
      <div id="week-detail" class="week-detail" hidden></div>
    </section>

    <section id="gorevler" aria-labelledby="tasks-heading" tabindex="-1">
      <div class="section-head">
        <h2 id="tasks-heading">Görevler</h2>
        <button id="task-add" class="btn btn--primary" type="button" aria-expanded="false" aria-controls="task-form">Görev ekle</button>
      </div>

      <form id="task-form" class="task-form" novalidate hidden aria-labelledby="task-form-heading">
        <h3 id="task-form-heading">Yeni görev</h3>
        <p class="muted">Kendi eklediğin görevler yalnızca bu tarayıcıda saklanır. <span aria-hidden="true">*</span> işaretli alanlar zorunlu.</p>
        <div class="task-form__grid">
          <div class="field field--wide">
            <label for="tf-title">Başlık <span aria-hidden="true">*</span></label>
            <input id="tf-title" name="title" type="text" maxlength="120" required aria-describedby="tf-title-error" autocomplete="off">
            <p id="tf-title-error" class="field-error" hidden></p>
          </div>
          <div class="field">
            <label for="tf-week">Hafta <span aria-hidden="true">*</span></label>
            <select id="tf-week" name="weekId" required aria-describedby="tf-week-error"></select>
            <p id="tf-week-error" class="field-error" hidden></p>
          </div>
          <div class="field">
            <label for="tf-due">Son tarih</label>
            <input id="tf-due" name="dueDate" type="date" aria-describedby="tf-due-error">
            <p id="tf-due-error" class="field-error" hidden></p>
          </div>
          <div class="field field--wide">
            <label for="tf-desc">Açıklama</label>
            <textarea id="tf-desc" name="description" rows="3" maxlength="500" aria-describedby="tf-desc-error"></textarea>
            <p id="tf-desc-error" class="field-error" hidden></p>
          </div>
          <div class="field field--wide">
            <label for="tf-tags">Etiketler</label>
            <input id="tf-tags" name="tags" type="text" autocomplete="off" aria-describedby="tf-tags-hint tf-tags-error">
            <p id="tf-tags-hint" class="muted field-hint">Virgülle ayır, en çok 5 etiket. Örnek: ödev, okuma</p>
            <p id="tf-tags-error" class="field-error" hidden></p>
          </div>
        </div>
        <div class="task-form__actions">
          <button class="btn btn--primary" type="submit">Kaydet</button>
          <button id="task-form-cancel" class="btn btn--quiet" type="button">Vazgeç</button>
        </div>
      </form>

      <div class="filters" role="group" aria-label="Görev filtreleri">
        <label>Durum
          <select id="filter-status">
            <option value="all">Tümü</option>
            <option value="todo">Yapılacak</option>
            <option value="in_progress">Devam eden</option>
            <option value="done">Tamamlanan</option>
          </select>
        </label>
        <label>Hafta
          <select id="filter-week"><option value="all">Tüm haftalar</option></select>
        </label>
        <button id="filter-clear" class="btn btn--quiet" type="button">Filtreleri temizle</button>
      </div>
      <p id="result-count" class="muted" aria-live="polite"></p>
      <ul id="task-list" class="tasks"></ul>
    </section>
  </main>

  <footer class="footer muted">
    <button id="reset" class="btn btn--quiet" type="button">İlerlemeyi sıfırla</button>
  </footer>
</body>
</html>
